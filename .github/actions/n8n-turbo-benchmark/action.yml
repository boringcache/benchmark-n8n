name: "Run n8n Turbo benchmark phase"
description: "Runs one n8n Turbo cache provider and phase."

inputs:
  benchmark_id:
    required: true
  strategy:
    required: true
  cache_lane:
    required: true
  phase:
    required: true
  cli_version:
    required: false
    default: ""
  node_version:
    required: true

runs:
  using: composite
  steps:
    - name: Validate benchmark strategy
      shell: bash
      env:
        STRATEGY: ${{ inputs.strategy }}
      run: |
        case "$STRATEGY" in
          actions-cache|boringcache) ;;
          *)
            echo "Unsupported benchmark strategy: $STRATEGY" >&2
            exit 1
            ;;
        esac

    - name: Checkout pinned n8n source
      shell: bash
      run: |
        git submodule sync --recursive
        git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream

    - name: Prepare clean n8n source
      shell: bash
      env:
        PREPARE_PHASE: ${{ inputs.phase == 'warm' && 'warm1' || 'base' }}
      run: ./scripts/prepare-source.sh "$PREPARE_PHASE"

    - name: Select the cache cohort
      id: scope
      shell: bash
      env:
        BENCHMARK_ID: ${{ inputs.benchmark_id }}
        CACHE_LANE: ${{ inputs.cache_lane }}
      run: |
        set -euo pipefail
        ref_slug="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
        ref_slug="${ref_slug#-}"
        ref_slug="${ref_slug%-}"
        ref_slug="${ref_slug:-main}"
        if [[ "$CACHE_LANE" == "rolling" ]]; then
          cache_scope="${BENCHMARK_ID}-rolling-${ref_slug}"
        else
          cache_scope="${BENCHMARK_ID}-run-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
        fi
        ./scripts/scope-boringcache-run.sh "$cache_scope"
        source_sha="$(git rev-parse HEAD:upstream)"
        echo "cache_scope=${cache_scope}" >> "$GITHUB_OUTPUT"
        echo "cache_key=turbo-${cache_scope}-${source_sha}" >> "$GITHUB_OUTPUT"

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version }}

    - name: Enable the pinned pnpm release
      shell: bash
      working-directory: upstream
      run: |
        corepack enable
        corepack install

    - name: Restore the GitHub Actions cache
      if: inputs.strategy == 'actions-cache' && inputs.phase == 'publish'
      uses: actions/cache@v5
      with:
        path: upstream/.turbo
        key: ${{ steps.scope.outputs.cache_key }}
        restore-keys: |
          turbo-${{ steps.scope.outputs.cache_scope }}-

    - name: Restore the exact GitHub Actions cache
      if: inputs.strategy == 'actions-cache' && inputs.phase == 'warm'
      uses: actions/cache/restore@v5
      with:
        path: upstream/.turbo
        key: ${{ steps.scope.outputs.cache_key }}
        fail-on-cache-miss: true

    - name: Publish with BoringCache
      id: boringcache-publish
      if: inputs.strategy == 'boringcache' && inputs.phase == 'publish'
      uses: boringcache/one@09e053620cda4d3472f26a3ddd181144a108e2c2 # v1.16.8
      with:
        cli-version: ${{ inputs.cli_version }}
        setup: none
        mode: turbo
        trust-policy: publish
        working-directory: upstream
        fail-on-cache-error: true
        metadata-hints: phase=${{ inputs.cache_lane == 'rolling' && 'rolling' || 'fresh-cold' }}

    - name: Restore with BoringCache
      id: boringcache-restore
      if: inputs.strategy == 'boringcache' && inputs.phase == 'warm'
      uses: boringcache/one@09e053620cda4d3472f26a3ddd181144a108e2c2 # v1.16.8
      with:
        cli-version: ${{ inputs.cli_version }}
        setup: none
        mode: turbo
        trust-policy: restore
        working-directory: upstream
        fail-on-cache-miss: true
        fail-on-cache-error: true
        metadata-hints: phase=fresh-warm

    - name: Install n8n dependencies
      shell: bash
      working-directory: upstream
      env:
        CI: "1"
      run: corepack pnpm install --frozen-lockfile

    - name: Build n8n
      shell: bash
      working-directory: upstream
      env:
        CI: "1"
      run: corepack pnpm turbo run build --summarize

    - name: Verify the n8n build
      shell: bash
      run: test -s upstream/packages/cli/dist/index.js

    - name: Retain publish evidence
      if: inputs.strategy == 'boringcache' && inputs.phase == 'publish'
      uses: actions/upload-artifact@v6
      with:
        name: n8n-turbo-${{ inputs.cache_lane }}-publish
        path: ${{ steps.boringcache-publish.outputs.evidence-path }}
        if-no-files-found: error

    - name: Retain warm evidence
      if: inputs.strategy == 'boringcache' && inputs.phase == 'warm'
      uses: actions/upload-artifact@v6
      with:
        name: n8n-turbo-fresh-restore
        path: ${{ steps.boringcache-restore.outputs.evidence-path }}
        if-no-files-found: error
