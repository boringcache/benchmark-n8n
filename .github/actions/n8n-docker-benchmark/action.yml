name: "Run n8n Docker benchmark phase"
description: "Runs one n8n Docker cache provider, image case, and phase."

inputs:
  benchmark_id:
    required: true
  push_image:
    required: false
    default: "false"
  strategy:
    required: true
  cache_lane:
    required: true
  phase:
    required: true
  cli_version:
    required: false
    default: ""
  buildkit_image:
    required: false
    default: ""
  dockerfile_path:
    required: true
  image:
    required: true
  node_version:
    required: true

runs:
  using: composite
  steps:
    - name: Start the workflow timer
      id: workflow_timer
      shell: bash
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Validate benchmark strategy
      shell: bash
      env:
        STRATEGY: ${{ inputs.strategy }}
      run: |
        case "$STRATEGY" in
          actions-cache|boringcache) ;;
          *)
            echo "Unsupported benchmark strategy: $STRATEGY" >&2
            exit 1
            ;;
        esac

    - name: Checkout pinned n8n source
      shell: bash
      run: |
        git submodule sync --recursive
        git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream

    - name: Verify the upstream benchmark recipe
      shell: bash
      run: python3 ./scripts/verify-upstream-recipe.py

    - name: Prepare clean n8n source
      shell: bash
      env:
        PREPARE_PHASE: ${{ inputs.phase == 'warm' && 'warm1' || 'base' }}
      run: ./scripts/prepare-source.sh "$PREPARE_PHASE"

    - name: Select the cache cohort
      id: scope
      shell: bash
      env:
        BENCHMARK_ID: ${{ inputs.benchmark_id }}
        CACHE_LANE: ${{ inputs.cache_lane }}
      run: |
        set -euo pipefail
        ref_slug="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
        ref_slug="${ref_slug#-}"
        ref_slug="${ref_slug%-}"
        ref_slug="${ref_slug:-main}"
        if [[ "$CACHE_LANE" == "rolling" ]]; then
          cache_scope="${BENCHMARK_ID}-rolling-${ref_slug}"
        else
          cache_scope="${BENCHMARK_ID}-run-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
        fi
        ./scripts/scope-boringcache-run.sh "$cache_scope"
        echo "cache_scope=${cache_scope}" >> "$GITHUB_OUTPUT"
        source_url="$(git config -f .gitmodules submodule.upstream.url)"
        echo "source_repository=$(printf '%s' "${source_url#https://github.com/}" | sed 's/\.git$//')" >> "$GITHUB_OUTPUT"
        echo "source_sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version }}

    - name: Enable the pinned pnpm release
      shell: bash
      working-directory: upstream
      run: |
        corepack enable
        corepack install

    - name: Install n8n dependencies
      shell: bash
      working-directory: upstream
      env:
        CI: "1"
      run: corepack pnpm install --frozen-lockfile

    - name: Build n8n source
      shell: bash
      working-directory: upstream
      env:
        CI: "1"
        N8N_SKIP_LICENSES: "true"
      run: corepack pnpm build:n8n

    - name: Verify the n8n build context
      shell: bash
      run: test -s upstream/packages/cli/dist/index.js

    - name: Log in to the GitHub Container Registry
      if: inputs.push_image == 'true' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Start the provider setup timer
      id: setup_timer
      shell: bash
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Set up Buildx for the GitHub Actions comparison
      if: inputs.strategy == 'actions-cache'
      uses: docker/setup-buildx-action@v4

    - name: Start the build timer
      id: build_timer
      shell: bash
      env:
        SETUP_STARTED_AT: ${{ steps.setup_timer.outputs.started_at }}
      run: |
        set -euo pipefail
        now="$(date +%s)"
        echo "setup_seconds=$(( now - SETUP_STARTED_AT ))" >> "$GITHUB_OUTPUT"
        echo "started_at=${now}" >> "$GITHUB_OUTPUT"
    - name: Build with the GitHub Actions cache
      if: inputs.strategy == 'actions-cache'
      uses: docker/build-push-action@v6
      env:
        DOCKER_BUILD_SUMMARY: "false"
        DOCKER_BUILD_RECORD_UPLOAD: "false"
      with:
        context: upstream
        file: ${{ inputs.dockerfile_path }}
        platforms: linux/amd64
        tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:actions-cache
        push: ${{ inputs.push_image == 'true' && github.ref == 'refs/heads/main' }}
        build-args: |
          NODE_VERSION=${{ inputs.node_version }}
          N8N_VERSION=snapshot
          N8N_RELEASE_TYPE=dev
        provenance: false
        sbom: true
        cache-from: type=gha,scope=${{ steps.scope.outputs.cache_scope }}
        cache-to: type=gha,scope=${{ steps.scope.outputs.cache_scope }},mode=max

    - name: Publish with BoringCache
      id: publish
      if: inputs.strategy == 'boringcache' && inputs.phase == 'publish'
      uses: boringcache/one@aac19c43035c9d77cfc2573f663d35ea3fce2868 # v1 / 1.19.7
      with:
        cli-version: ${{ inputs.cli_version }}
        setup: none
        mode: docker
        trust-policy: publish
        working-directory: .
        context: upstream
        dockerfile: ${{ inputs.dockerfile_path }}
        image: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
        tags: boringcache
        push: ${{ inputs.push_image == 'true' && github.ref == 'refs/heads/main' }}
        platforms: linux/amd64
        build-args: |
          NODE_VERSION=${{ inputs.node_version }}
          N8N_VERSION=snapshot
          N8N_RELEASE_TYPE=dev
        provenance: false
        sbom: true
        load: false
        fail-on-cache-error: true
        metadata-hints: benchmark=${{ inputs.benchmark_id }},phase=${{ inputs.cache_lane == 'rolling' && 'rolling-docker' || 'fresh-cold-docker' }}
        managed-buildkit-image: ${{ inputs.buildkit_image }}

    - name: Restore with BoringCache
      id: restore
      if: inputs.strategy == 'boringcache' && inputs.phase == 'warm'
      uses: boringcache/one@aac19c43035c9d77cfc2573f663d35ea3fce2868 # v1 / 1.19.7
      with:
        cli-version: ${{ inputs.cli_version }}
        setup: none
        mode: docker
        trust-policy: restore
        working-directory: .
        context: upstream
        dockerfile: ${{ inputs.dockerfile_path }}
        image: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
        tags: boringcache
        push: ${{ inputs.push_image == 'true' && github.ref == 'refs/heads/main' }}
        platforms: linux/amd64
        build-args: |
          NODE_VERSION=${{ inputs.node_version }}
          N8N_VERSION=snapshot
          N8N_RELEASE_TYPE=dev
        provenance: false
        sbom: true
        load: false
        fail-on-cache-miss: true
        fail-on-cache-error: true
        metadata-hints: benchmark=${{ inputs.benchmark_id }},phase=fresh-warm-docker
        managed-buildkit-image: ${{ inputs.buildkit_image }}

    - name: Capture the build timing
      id: build_timing
      shell: bash
      env:
        BUILD_STARTED_AT: ${{ steps.build_timer.outputs.started_at }}
      run: echo "build_seconds=$(( $(date +%s) - BUILD_STARTED_AT ))" >> "$GITHUB_OUTPUT"
    - name: Write the benchmark phase evidence
      shell: bash
      env:
        BENCHMARK_ID: ${{ inputs.benchmark_id }}
        STRATEGY: ${{ inputs.strategy }}
        CACHE_LANE: ${{ inputs.cache_lane }}
        REPORT_PHASE: ${{ inputs.cache_lane == 'rolling' && 'commit' || inputs.phase == 'warm' && 'warm' || 'cold' }}
        WORKFLOW_STARTED_AT: ${{ steps.workflow_timer.outputs.started_at }}
        SETUP_SECONDS: ${{ steps.build_timer.outputs.setup_seconds }}
        BUILD_SECONDS: ${{ steps.build_timing.outputs.build_seconds }}
        CACHE_HIT: ${{ steps.publish.outputs.cache-hit || steps.restore.outputs.cache-hit }}
        CACHE_IMPORT_READY: ${{ steps.publish.outputs.docker-cache-import-ready || steps.restore.outputs.docker-cache-import-ready }}
        CACHE_IMPORT_REFS: ${{ steps.publish.outputs.docker-cache-from-refs || steps.restore.outputs.docker-cache-from-refs }}
        CACHE_TAG: ${{ steps.publish.outputs.cache-tag || steps.restore.outputs.cache-tag }}
        CACHE_WORKSPACE: ${{ steps.publish.outputs.workspace || steps.restore.outputs.workspace }}
        EVIDENCE_PATH: ${{ steps.publish.outputs.evidence-path || steps.restore.outputs.evidence-path }}
        SOURCE_REPOSITORY: ${{ steps.scope.outputs.source_repository }}
        SOURCE_SHA: ${{ steps.scope.outputs.source_sha }}
      run: |
        set -euo pipefail
        python3 ./scripts/benchmark-report.py phase \
          --benchmark "$BENCHMARK_ID" \
          --strategy "$STRATEGY" \
          --lane "$CACHE_LANE" \
          --phase "$REPORT_PHASE" \
          --mode docker \
          --restore-or-setup-seconds "$SETUP_SECONDS" \
          --workflow-seconds "$(( $(date +%s) - WORKFLOW_STARTED_AT ))" \
          --build-seconds "$BUILD_SECONDS" \
          --cache-hit "$CACHE_HIT" \
          --cache-import-ready "$CACHE_IMPORT_READY" \
          --cache-import-refs "$CACHE_IMPORT_REFS" \
          --cache-tag "$CACHE_TAG" \
          --workspace "$CACHE_WORKSPACE" \
          --source-repository "$SOURCE_REPOSITORY" \
          --source-sha "$SOURCE_SHA" \
          --evidence "$EVIDENCE_PATH"
    - name: Retain the benchmark phase evidence
      uses: actions/upload-artifact@v6
      with:
        name: phase-${{ inputs.benchmark_id }}-${{ inputs.strategy }}-${{ inputs.cache_lane }}-${{ inputs.cache_lane == 'rolling' && 'commit' || inputs.phase == 'warm' && 'warm' || 'cold' }}
        path: benchmark-results/
        if-no-files-found: error
