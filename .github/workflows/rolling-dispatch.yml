name: "Rolling Benchmark Dispatch"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "upstream"

permissions:
  contents: read
  actions: write

jobs:
  dispatch-turbo:
    name: Dispatch Turbo rolling benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Turbo rolling benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run "n8n-benchmark.yml" --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
          -f cache_lane=rolling

  dispatch-docker:
    name: Dispatch Docker rolling benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Docker rolling benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run "n8n-docker-benchmark.yml" --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
