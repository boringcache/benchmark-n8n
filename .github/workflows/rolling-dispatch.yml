name: "Rolling Benchmark Dispatch"

on:
  workflow_dispatch:
      run_turbo:
        description: "Dispatch the Turbo rolling benchmark"
        required: false
        type: boolean
        default: true
      run_docker:
        description: "Dispatch the Docker rolling benchmark pair"
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "upstream"

permissions:
  contents: read
  actions: write

jobs:
  dispatch-turbo:
    name: Dispatch Turbo rolling benchmark
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_turbo }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Turbo rolling benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run "n8n-benchmark.yml" --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
          -f cache_lane=rolling

  dispatch-docker:
    name: Dispatch Docker rolling benchmark
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_docker }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Docker rolling benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run "n8n-docker-benchmark.yml" --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
