name: "n8n Turbo Fresh"
run-name: >-
  ${{ format('Benchmark {0} | {1}', github.event_name == 'pull_request' && 'Validation' || inputs.cli_version != '' && 'Canary' || 'Fresh', github.event_name == 'schedule' && 'Weekly' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "Optional exact BoringCache CLI release tag."
        required: false
        type: string
        default: ""
      runner_label:
        description: "Optional runner label for a manual main-branch experiment."
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 3 * * 6"
  pull_request:
    paths:
      - ".gitmodules"
      - ".github/actions/n8n-turbo-benchmark/**"
      - ".github/workflows/n8n-benchmark.yml"
      - ".github/workflows/n8n-fresh-benchmark.yml"
      - "README.md"
      - "scenarios/**"
      - "scripts/**"
      - "upstream"

permissions:
  contents: read
  actions: write

env:
  BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
  BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
  BORINGCACHE_NO_GIT: "true"

jobs:
  cold:
    name: ${{ matrix.provider }} n8n cold
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: GitHub Actions
            strategy: actions-cache
          - provider: BoringCache
            strategy: boringcache
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/n8n-turbo-benchmark
        with:
          benchmark_id: n8n
          strategy: ${{ matrix.strategy }}
          cache_lane: fresh
          phase: publish
          cli_version: ${{ inputs.cli_version }}
          node_version: "24.18.1"

  warm:
    name: ${{ matrix.provider }} n8n warm
    needs: cold
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: GitHub Actions
            strategy: actions-cache
          - provider: BoringCache
            strategy: boringcache
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/n8n-turbo-benchmark
        with:
          benchmark_id: n8n
          strategy: ${{ matrix.strategy }}
          cache_lane: fresh
          phase: warm
          cli_version: ${{ inputs.cli_version }}
          node_version: "24.18.1"
  report:
    name: n8n Turbo fresh report
    needs: warm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download the benchmark phase evidence
        uses: actions/download-artifact@v6
        with:
          pattern: phase-*
          path: phase-evidence
      - name: Publish the n8n Turbo benchmark report
        run: |
          python3 ./scripts/benchmark-report.py summarize \
            --title "n8n Turbo fresh benchmark" \
            --input-dir phase-evidence \
            --output-dir benchmark-results
      - name: Retain the n8n BoringCache fresh result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-n8n-boringcache-fresh
          path: benchmark-results/n8n-boringcache-fresh.json
          if-no-files-found: error
      - name: Retain the n8n GitHub Actions fresh result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-n8n-actions-cache-fresh
          path: benchmark-results/n8n-actions-cache-fresh.json
          if-no-files-found: error
