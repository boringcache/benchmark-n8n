name: "n8n Turbo Benchmark"
run-name: >-
  ${{ format('Benchmark {0} | {1}', github.event_name == 'workflow_dispatch' && inputs.cli_version != '' && 'Canary' || (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'rolling')) && 'Rolling' || 'Fresh', github.event_name == 'push' && 'Upstream update' || github.event_name == 'schedule' && 'Weekly' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      cache_lane:
        description: "Benchmark lane"
        required: false
        type: choice
        default: fresh
        options:
          - fresh
          - rolling
      cli_version:
        description: "Optional BoringCache CLI release tag for canary runs."
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "upstream"
  schedule:
    - cron: "0 3 * * 6"
  pull_request:
    paths:
      - ".gitmodules"
      - ".github/workflows/n8n-benchmark.yml"
      - ".github/workflows/reusable-node-turbo-benchmark.yml"
      - "README.md"
      - "scenarios/**"
      - "scripts/**"
      - "upstream"

permissions:
  contents: read
  actions: write

jobs:
  github-actions-cache:
    name: GHA
    uses: ./.github/workflows/reusable-node-turbo-benchmark.yml
    with:
      benchmark_id: n8n
      project_repo: n8n-io/n8n
      strategy: actions-cache
      cache_lane: ${{ github.event_name == 'push' && 'rolling' || github.event_name == 'workflow_dispatch' && inputs.cache_lane || 'fresh' }}
      node_version: "24.13.1"
      install_command: CI=1 pnpm install --frozen-lockfile
      build_command: CI=1 pnpm turbo run build --summarize
    secrets: inherit

  boringcache:
    name: BC
    uses: ./.github/workflows/reusable-node-turbo-benchmark.yml
    with:
      benchmark_id: n8n
      project_repo: n8n-io/n8n
      strategy: boringcache
      cache_lane: ${{ github.event_name == 'push' && 'rolling' || github.event_name == 'workflow_dispatch' && inputs.cache_lane || 'fresh' }}
      cli_version: ${{ inputs.cli_version }}
      node_version: "24.13.1"
      install_command: CI=1 pnpm install --frozen-lockfile
      build_command: CI=1 pnpm turbo run build --summarize
    secrets: inherit
