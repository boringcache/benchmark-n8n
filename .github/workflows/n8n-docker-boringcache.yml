name: "n8n Docker - BC"
run-name: >-
  ${{ format('{0} | {1}', github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'rolling' && 'BC Rolling' || 'BC Fresh', github.event_name == 'schedule' && 'Weekly fresh' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      cache_lane:
        description: "Benchmark lane"
        required: false
        type: choice
        default: fresh
        options:
          - fresh
          - rolling
      buildkit_backend:
        description: "BoringCache BuildKit backend"
        required: false
        type: choice
        default: both
        options:
          - both
          - registry
          - auto
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.cache_lane || 'fresh' }}-${{ github.event_name == 'workflow_dispatch' && inputs.buildkit_backend || 'both' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  benchmark:
    name: ${{ matrix.buildkit_backend == 'auto' && format('BC auto / {0}', matrix.image.label) || format('BC / {0}', matrix.image.label) }}
    strategy:
      fail-fast: false
      matrix:
        buildkit_backend: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.buildkit_backend == 'registry') && '["registry"]' || (github.event_name == 'workflow_dispatch' && inputs.buildkit_backend == 'auto') && '["auto"]' || '["registry","auto"]') }}
        image:
          - label: n8n
            benchmark_id: n8n-docker
            dockerfile_path: upstream/docker/images/n8n/Dockerfile
            image_tag: n8n-benchmark:latest
          - label: runners
            benchmark_id: n8n-runners
            dockerfile_path: upstream/docker/images/runners/Dockerfile
            image_tag: n8n-runners-benchmark:latest
          - label: distroless
            benchmark_id: n8n-runners-distroless
            dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
            image_tag: n8n-runners-distroless-benchmark:latest
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: boringcache
      cache_lane: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_lane || 'fresh' }}
      buildkit_backend: ${{ matrix.buildkit_backend }}
      benchmark_id: ${{ matrix.buildkit_backend == 'auto' && format('{0}-auto', matrix.image.benchmark_id) || matrix.image.benchmark_id }}
      project_repo: n8n-io/n8n
      dockerfile_path: ${{ matrix.image.dockerfile_path }}
      docker_context: upstream
      docker_build_args: |
        --build-arg=NODE_VERSION=24.15.0
        --build-arg=N8N_VERSION=snapshot
        --build-arg=N8N_RELEASE_TYPE=dev
      image_tag: ${{ matrix.image.image_tag }}
      prepare_install_command: CI=true pnpm install --frozen-lockfile
      prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
      prepare_node_version: "24.13.1"
      cli_platform: linux-amd64
      benchmark_workspace: ${{ github.repository }}
    secrets: inherit
    permissions:
      contents: read
      actions: write
