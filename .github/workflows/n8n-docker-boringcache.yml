name: "n8n Docker - BoringCache"
run-name: >-
  ${{ format('{0} | {1}', github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'rolling' && 'BoringCache Rolling' || 'BoringCache Fresh', github.event_name == 'schedule' && 'Weekly fresh' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      cache_lane:
        description: "Benchmark lane"
        required: false
        type: choice
        default: fresh
        options:
          - fresh
          - rolling
      buildkit_backend:
        description: "BoringCache BuildKit backend"
        required: false
        type: choice
        default: registry
        options:
          - registry
          - native
      cli_ref:
        description: "Internal benchmark diagnostic only: build this boringcache/cli ref instead of using the released CLI"
        required: false
        type: string
      blob_download_concurrency:
        description: "Optional BORINGCACHE_BLOB_DOWNLOAD_CONCURRENCY override (blank = adaptive)"
        required: false
        type: string
      blob_prefetch_concurrency:
        description: "Optional BORINGCACHE_BLOB_PREFETCH_CONCURRENCY override (blank = match download concurrency)"
        required: false
        type: string
      oci_stream_through_min_bytes:
        description: "Optional BORINGCACHE_OCI_STREAM_THROUGH_MIN_BYTES for Docker/OCI large blobs (blank = disabled)"
        required: false
        type: string
  schedule:
    - cron: "30 3 * * 6"
  pull_request:
    paths:
      - ".gitmodules"
      - ".github/workflows/n8n-docker-boringcache.yml"
      - ".github/workflows/n8n-docker-actions-cache.yml"
      - ".github/workflows/reusable-docker-buildkit-benchmark.yml"
      - "README.md"
      - "scenarios/**"
      - "scripts/**"
      - "upstream"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.cache_lane || 'fresh' }}-${{ github.event_name == 'workflow_dispatch' && inputs.buildkit_backend || 'registry' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        image:
          - benchmark_id: n8n-docker
            dockerfile_path: upstream/docker/images/n8n/Dockerfile
            image_tag: n8n-benchmark:latest
          - benchmark_id: n8n-runners
            dockerfile_path: upstream/docker/images/runners/Dockerfile
            image_tag: n8n-runners-benchmark:latest
          - benchmark_id: n8n-runners-distroless
            dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
            image_tag: n8n-runners-distroless-benchmark:latest
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: boringcache
      cache_lane: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_lane || 'fresh' }}
      buildkit_backend: ${{ github.event_name == 'workflow_dispatch' && inputs.buildkit_backend || 'registry' }}
      benchmark_id: ${{ matrix.image.benchmark_id }}
      project_repo: n8n-io/n8n
      dockerfile_path: ${{ matrix.image.dockerfile_path }}
      docker_context: upstream
      docker_build_args: |
        --build-arg=NODE_VERSION=24.15.0
        --build-arg=N8N_VERSION=snapshot
        --build-arg=N8N_RELEASE_TYPE=dev
      image_tag: ${{ matrix.image.image_tag }}
      prepare_install_command: CI=true pnpm install --frozen-lockfile
      prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
      prepare_node_version: "24.13.1"
      cli_platform: linux-amd64
      benchmark_workspace: ${{ github.repository }}
      cli_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.cli_ref || '' }}
      blob_download_concurrency: ${{ github.event_name == 'workflow_dispatch' && inputs.blob_download_concurrency || '' }}
      blob_prefetch_concurrency: ${{ github.event_name == 'workflow_dispatch' && inputs.blob_prefetch_concurrency || '' }}
      oci_stream_through_min_bytes: ${{ github.event_name == 'workflow_dispatch' && inputs.oci_stream_through_min_bytes || '' }}
    secrets: inherit
    permissions:
      contents: read
      actions: write
