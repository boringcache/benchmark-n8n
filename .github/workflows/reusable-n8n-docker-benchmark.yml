name: "Reusable n8n Docker Benchmark"

on:
  workflow_call:
    inputs:
      benchmark_id:
        required: true
        type: string
      strategy:
        required: true
        type: string
      cache_lane:
        required: false
        type: string
        default: fresh
      cli_version:
        description: "Optional exact BoringCache CLI release tag for canary runs."
        required: false
        type: string
        default: ""
      buildkit_image:
        description: "Optional managed BoringCache BuildKit image."
        required: false
        type: string
        default: ""
      dockerfile_path:
        required: true
        type: string
      image:
        required: true
        type: string
      node_version:
        required: true
        type: string

env:
  BENCHMARK_ID: ${{ inputs.benchmark_id }}
  CACHE_LANE: ${{ inputs.cache_lane }}

jobs:
  publish:
    name: ${{ inputs.cache_lane == 'rolling' && 'Commit' || 'Cold' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      cache_scope: ${{ steps.scope.outputs.cache_scope }}
      source_cache_key: ${{ steps.scope.outputs.source_cache_key }}

    steps:
      - name: Validate benchmark strategy
        env:
          STRATEGY: ${{ inputs.strategy }}
        run: |
          case "$STRATEGY" in
            actions-cache|boringcache) ;;
            *)
              echo "Unsupported benchmark strategy: $STRATEGY" >&2
              exit 1
              ;;
          esac

      - name: Checkout benchmark repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Checkout pinned n8n source
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream

      - name: Prepare clean n8n source
        run: ./scripts/prepare-source.sh base

      - name: Select the cache cohort
        id: scope
        run: |
          set -euo pipefail

          ref_slug="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          ref_slug="${ref_slug#-}"
          ref_slug="${ref_slug%-}"
          ref_slug="${ref_slug:-main}"
          if [[ "$CACHE_LANE" == "rolling" ]]; then
            cache_scope="${BENCHMARK_ID}-rolling-${ref_slug}"
          else
            cache_scope="${BENCHMARK_ID}-run-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          fi

          ./scripts/scope-boringcache-run.sh "$cache_scope"
          source_sha="$(git rev-parse HEAD:upstream)"
          echo "cache_scope=${cache_scope}" >> "$GITHUB_OUTPUT"
          echo "source_cache_key=n8n-source-${cache_scope}-${source_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable the pinned pnpm release
        working-directory: upstream
        run: |
          corepack enable
          corepack install

      - name: Select the GitHub Actions pnpm store
        if: inputs.strategy == 'actions-cache'
        run: |
          echo "PNPM_STORE_DIR=${GITHUB_WORKSPACE}/.pnpm-store" >> "$GITHUB_ENV"
          echo "npm_config_store_dir=${GITHUB_WORKSPACE}/.pnpm-store" >> "$GITHUB_ENV"

      - name: Restore source caches with GitHub Actions
        if: inputs.strategy == 'actions-cache'
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.pnpm-store
            upstream/.turbo
          key: ${{ steps.scope.outputs.source_cache_key }}
          restore-keys: |
            n8n-source-${{ steps.scope.outputs.cache_scope }}-

      - name: Configure BoringCache for n8n source preparation
        if: inputs.strategy == 'boringcache'
        uses: boringcache/one@09e053620cda4d3472f26a3ddd181144a108e2c2 # v1.16.8
        with:
          cli-version: ${{ inputs.cli_version }}
          setup: none
          mode: turbo
          trust-policy: publish
          working-directory: upstream
          cache-profiles: benchmark
          fail-on-cache-error: true
          metadata-hints: benchmark=${{ inputs.benchmark_id }},phase=${{ inputs.cache_lane == 'rolling' && 'rolling-source' || 'fresh-cold-source' }}
          proxy-port: "22244"
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
          BORINGCACHE_NO_GIT: "true"

      - name: Install n8n dependencies
        working-directory: upstream
        env:
          CI: "1"
        run: corepack pnpm install --frozen-lockfile

      - name: Build n8n source
        working-directory: upstream
        env:
          CI: "1"
          N8N_SKIP_LICENSES: "true"
        run: corepack pnpm build:n8n

      - name: Verify the n8n build context
        run: test -s upstream/packages/cli/dist/index.js

      - name: Set up Buildx for the GitHub Actions comparison
        if: inputs.strategy == 'actions-cache'
        uses: docker/setup-buildx-action@v4

      - name: Build with the GitHub Actions cache
        if: inputs.strategy == 'actions-cache'
        env:
          CACHE_SCOPE: ${{ steps.scope.outputs.cache_scope }}
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          IMAGE: ${{ inputs.image }}
        run: |
          docker buildx build \
            --file "$DOCKERFILE_PATH" \
            --tag "${IMAGE}:latest" \
            --build-arg N8N_VERSION=snapshot \
            --build-arg N8N_RELEASE_TYPE=dev \
            --cache-from "type=gha,scope=${CACHE_SCOPE}" \
            --cache-to "type=gha,scope=${CACHE_SCOPE},mode=max" \
            --load \
            upstream

      - name: Build with BoringCache
        if: inputs.strategy == 'boringcache'
        uses: boringcache/one@09e053620cda4d3472f26a3ddd181144a108e2c2 # v1.16.8
        with:
          cli-version: ${{ inputs.cli_version }}
          setup: none
          mode: docker
          trust-policy: publish
          working-directory: .
          context: upstream
          dockerfile: ${{ inputs.dockerfile_path }}
          image: ${{ inputs.image }}
          tags: latest
          build-args: |
            N8N_VERSION=snapshot
            N8N_RELEASE_TYPE=dev
          load: true
          fail-on-cache-error: true
          metadata-hints: benchmark=${{ inputs.benchmark_id }},phase=${{ inputs.cache_lane == 'rolling' && 'rolling-docker' || 'fresh-cold-docker' }}
          managed-buildkit-image: ${{ inputs.buildkit_image }}
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
          BORINGCACHE_NO_GIT: "true"

      - name: Verify the built image
        env:
          IMAGE: ${{ inputs.image }}
        run: docker image inspect "${IMAGE}:latest" >/dev/null

  replay:
    name: Warm
    needs: publish
    if: inputs.cache_lane == 'fresh'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Checkout pinned n8n source
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream

      - name: Prepare clean n8n source
        run: ./scripts/prepare-source.sh warm1

      - name: Select the published cache cohort
        run: ./scripts/scope-boringcache-run.sh "${{ needs.publish.outputs.cache_scope }}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable the pinned pnpm release
        working-directory: upstream
        run: |
          corepack enable
          corepack install

      - name: Select the GitHub Actions pnpm store
        if: inputs.strategy == 'actions-cache'
        run: |
          echo "PNPM_STORE_DIR=${GITHUB_WORKSPACE}/.pnpm-store" >> "$GITHUB_ENV"
          echo "npm_config_store_dir=${GITHUB_WORKSPACE}/.pnpm-store" >> "$GITHUB_ENV"

      - name: Restore exact source caches with GitHub Actions
        if: inputs.strategy == 'actions-cache'
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ github.workspace }}/.pnpm-store
            upstream/.turbo
          key: ${{ needs.publish.outputs.source_cache_key }}
          fail-on-cache-miss: true

      - name: Restore the exact BoringCache source caches
        if: inputs.strategy == 'boringcache'
        uses: boringcache/one@09e053620cda4d3472f26a3ddd181144a108e2c2 # v1.16.8
        with:
          cli-version: ${{ inputs.cli_version }}
          setup: none
          mode: turbo
          trust-policy: restore
          working-directory: upstream
          cache-profiles: benchmark
          fail-on-cache-miss: true
          fail-on-cache-error: true
          metadata-hints: benchmark=${{ inputs.benchmark_id }},phase=fresh-warm-source
          proxy-port: "22244"
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_NO_GIT: "true"

      - name: Install n8n dependencies
        working-directory: upstream
        env:
          CI: "1"
        run: corepack pnpm install --offline --frozen-lockfile

      - name: Build n8n source
        working-directory: upstream
        env:
          CI: "1"
          N8N_SKIP_LICENSES: "true"
        run: corepack pnpm build:n8n

      - name: Verify the restored n8n build context
        run: test -s upstream/packages/cli/dist/index.js

      - name: Set up Buildx for the GitHub Actions comparison
        if: inputs.strategy == 'actions-cache'
        uses: docker/setup-buildx-action@v4

      - name: Build with the exact GitHub Actions cache
        if: inputs.strategy == 'actions-cache'
        env:
          CACHE_SCOPE: ${{ needs.publish.outputs.cache_scope }}
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          IMAGE: ${{ inputs.image }}
        run: |
          docker buildx build \
            --file "$DOCKERFILE_PATH" \
            --tag "${IMAGE}:latest" \
            --build-arg N8N_VERSION=snapshot \
            --build-arg N8N_RELEASE_TYPE=dev \
            --cache-from "type=gha,scope=${CACHE_SCOPE}" \
            --cache-to "type=gha,scope=${CACHE_SCOPE},mode=max" \
            --load \
            upstream

      - name: Restore the exact BoringCache Docker cache
        if: inputs.strategy == 'boringcache'
        uses: boringcache/one@09e053620cda4d3472f26a3ddd181144a108e2c2 # v1.16.8
        with:
          cli-version: ${{ inputs.cli_version }}
          setup: none
          mode: docker
          trust-policy: restore
          working-directory: .
          context: upstream
          dockerfile: ${{ inputs.dockerfile_path }}
          image: ${{ inputs.image }}
          tags: latest
          build-args: |
            N8N_VERSION=snapshot
            N8N_RELEASE_TYPE=dev
          load: true
          fail-on-cache-miss: true
          fail-on-cache-error: true
          metadata-hints: benchmark=${{ inputs.benchmark_id }},phase=fresh-warm-docker
          managed-buildkit-image: ${{ inputs.buildkit_image }}
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_NO_GIT: "true"

      - name: Verify the restored image
        env:
          IMAGE: ${{ inputs.image }}
        run: docker image inspect "${IMAGE}:latest" >/dev/null
