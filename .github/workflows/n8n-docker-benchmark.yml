name: "n8n Docker Benchmark"
run-name: >-
  ${{ format('Benchmark Rolling | {0}', github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.event_name == 'schedule' && 'Scheduled' || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
  schedule:
    - cron: "30 3 * * 6"
  pull_request:
    paths:
      - ".gitmodules"
      - ".github/actions/docker-rolling-benchmark/**"
      - ".github/workflows/n8n-docker-benchmark.yml"
      - ".github/workflows/reusable-docker-buildkit-benchmark.yml"
      - "README.md"
      - "scenarios/**"
      - "scripts/**"
      - "upstream"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  gha-n8n:
    name: GHA / n8n
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: GHA
        uses: ./.github/actions/docker-rolling-benchmark
        with:
          strategy: actions-cache
          benchmark_id: n8n-docker
          project_repo: n8n-io/n8n
          dockerfile_path: upstream/docker/images/n8n/Dockerfile
          docker_context: upstream
          docker_build_args: |
            --build-arg=NODE_VERSION=24.15.0
            --build-arg=N8N_VERSION=snapshot
            --build-arg=N8N_RELEASE_TYPE=dev
          image_tag: n8n-benchmark:latest
          prepare_install_command: CI=true pnpm install --frozen-lockfile
          prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
          prepare_node_version: "24.13.1"
          benchmark_workspace: ${{ github.repository }}

  gha-runners:
    name: GHA / runners
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: GHA
        uses: ./.github/actions/docker-rolling-benchmark
        with:
          strategy: actions-cache
          benchmark_id: n8n-runners
          project_repo: n8n-io/n8n
          dockerfile_path: upstream/docker/images/runners/Dockerfile
          docker_context: upstream
          docker_build_args: |
            --build-arg=NODE_VERSION=24.15.0
            --build-arg=N8N_VERSION=snapshot
            --build-arg=N8N_RELEASE_TYPE=dev
          image_tag: n8n-runners-benchmark:latest
          prepare_install_command: CI=true pnpm install --frozen-lockfile
          prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
          prepare_node_version: "24.13.1"
          benchmark_workspace: ${{ github.repository }}

  gha-distroless:
    name: GHA / distroless
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: GHA
        uses: ./.github/actions/docker-rolling-benchmark
        with:
          strategy: actions-cache
          benchmark_id: n8n-runners-distroless
          project_repo: n8n-io/n8n
          dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
          docker_context: upstream
          docker_build_args: |
            --build-arg=NODE_VERSION=24.15.0
            --build-arg=N8N_VERSION=snapshot
            --build-arg=N8N_RELEASE_TYPE=dev
          image_tag: n8n-runners-distroless-benchmark:latest
          prepare_install_command: CI=true pnpm install --frozen-lockfile
          prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
          prepare_node_version: "24.13.1"
          benchmark_workspace: ${{ github.repository }}

  bc-n8n:
    name: BC / n8n
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
      BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
      BORINGCACHE_API_TOKEN: ${{ secrets.BORINGCACHE_API_TOKEN || secrets.BORINGCACHE_RESTORE_TOKEN }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
