name: "n8n Docker Benchmark"
run-name: >-
  ${{ format('Benchmark {0} | {1}', github.event_name == 'pull_request' && 'Validation' || github.event_name == 'workflow_dispatch' && inputs.cli_version != '' && 'Canary' || (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'rolling')) && 'Rolling' || 'Fresh', github.event_name == 'push' && 'Upstream update' || github.event_name == 'schedule' && 'Weekly' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      cache_lane:
        description: "Benchmark lane"
        required: false
        type: choice
        default: fresh
        options:
          - fresh
          - rolling
      prewarm_buildkit_image:
        description: "Optional experimental BuildKit image for the BoringCache backend lane."
        required: false
        type: string
        default: ""
      cli_version:
        description: "Optional BoringCache CLI release tag for canary runs, for example vcli-canary."
        required: false
        type: string
        default: ""
      benchmark_id_suffix:
        description: "Optional suffix appended to built-in benchmark/cache scopes for isolated comparison runs."
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "upstream"
  schedule:
    - cron: "30 3 * * 6"
  pull_request:
    paths:
      - ".gitmodules"
      - ".github/actions/docker-rolling-benchmark/**"
      - ".github/workflows/n8n-docker-benchmark.yml"
      - ".github/workflows/reusable-docker-buildkit-benchmark.yml"
      - "README.md"
      - "scenarios/**"
      - "scripts/**"
      - "upstream"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  gha-n8n:
    name: GHA / n8n
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'rolling') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: GHA
        uses: ./.github/actions/docker-rolling-benchmark
        with:
          strategy: actions-cache
          benchmark_id: n8n-docker${{ inputs.benchmark_id_suffix }}
          project_repo: n8n-io/n8n
          dockerfile_path: upstream/docker/images/n8n/Dockerfile
          docker_context: upstream
          docker_build_args: |
            --build-arg=NODE_VERSION=24.15.0
            --build-arg=N8N_VERSION=snapshot
            --build-arg=N8N_RELEASE_TYPE=dev
          image_tag: n8n-benchmark:latest
          prepare_install_command: CI=true pnpm install --frozen-lockfile
          prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
          prepare_node_version: "24.13.1"
          benchmark_workspace: ${{ github.repository }}

  gha-runners:
    name: GHA / runners
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'rolling') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: GHA
        uses: ./.github/actions/docker-rolling-benchmark
        with:
          strategy: actions-cache
          benchmark_id: n8n-runners${{ inputs.benchmark_id_suffix }}
          project_repo: n8n-io/n8n
          dockerfile_path: upstream/docker/images/runners/Dockerfile
          docker_context: upstream
          docker_build_args: |
            --build-arg=NODE_VERSION=24.15.0
            --build-arg=N8N_VERSION=snapshot
            --build-arg=N8N_RELEASE_TYPE=dev
          image_tag: n8n-runners-benchmark:latest
          prepare_install_command: CI=true pnpm install --frozen-lockfile
          prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
          prepare_node_version: "24.13.1"
          benchmark_workspace: ${{ github.repository }}

  gha-distroless:
    name: GHA / distroless
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'rolling') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: GHA
        uses: ./.github/actions/docker-rolling-benchmark
        with:
          strategy: actions-cache
          benchmark_id: n8n-runners-distroless${{ inputs.benchmark_id_suffix }}
          project_repo: n8n-io/n8n
          dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
          docker_context: upstream
          docker_build_args: |
            --build-arg=NODE_VERSION=24.15.0
            --build-arg=N8N_VERSION=snapshot
            --build-arg=N8N_RELEASE_TYPE=dev
          image_tag: n8n-runners-distroless-benchmark:latest
          prepare_install_command: CI=true pnpm install --frozen-lockfile
          prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
          prepare_node_version: "24.13.1"
          benchmark_workspace: ${{ github.repository }}

  bc-n8n:
    name: BC OCI / n8n
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'rolling') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
      BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
      BORINGCACHE_API_TOKEN: ${{ secrets.BORINGCACHE_API_TOKEN || secrets.BORINGCACHE_RESTORE_TOKEN }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: BC OCI
        uses: ./.github/actions/docker-rolling-benchmark
        with:
          strategy: boringcache
          buildkit_backend: registry
          benchmark_id: n8n-docker${{ inputs.benchmark_id_suffix }}
          project_repo: n8n-io/n8n
          dockerfile_path: upstream/docker/images/n8n/Dockerfile
          docker_context: upstream
          docker_build_args: |
            --build-arg=NODE_VERSION=24.15.0
            --build-arg=N8N_VERSION=snapshot
            --build-arg=N8N_RELEASE_TYPE=dev
          image_tag: n8n-benchmark:latest
          prepare_install_command: CI=true pnpm install --frozen-lockfile
          prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
          prepare_node_version: "24.13.1"
          cli_platform: linux-amd64
          cli_version: ${{ inputs.cli_version || vars.BORINGCACHE_BENCHMARK_CLI_VERSION || 'v1.13.93' }}
          benchmark_workspace: ${{ github.repository }}
  bc-runners:
    name: BC OCI / runners
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'rolling') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
      BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
      BORINGCACHE_API_TOKEN: ${{ secrets.BORINGCACHE_API_TOKEN || secrets.BORINGCACHE_RESTORE_TOKEN }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: BC OCI
        uses: ./.github/actions/docker-rolling-benchmark
        with:
          strategy: boringcache
          buildkit_backend: registry
          benchmark_id: n8n-runners${{ inputs.benchmark_id_suffix }}
          project_repo: n8n-io/n8n
          dockerfile_path: upstream/docker/images/runners/Dockerfile
          docker_context: upstream
          docker_build_args: |
            --build-arg=NODE_VERSION=24.15.0
            --build-arg=N8N_VERSION=snapshot
            --build-arg=N8N_RELEASE_TYPE=dev
          image_tag: n8n-runners-benchmark:latest
          prepare_install_command: CI=true pnpm install --frozen-lockfile
          prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
          prepare_node_version: "24.13.1"
          cli_platform: linux-amd64
          cli_version: ${{ inputs.cli_version || vars.BORINGCACHE_BENCHMARK_CLI_VERSION || 'v1.13.93' }}
          benchmark_workspace: ${{ github.repository }}
  bc-distroless:
    name: BC OCI / distroless
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'rolling') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
      BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
      BORINGCACHE_API_TOKEN: ${{ secrets.BORINGCACHE_API_TOKEN || secrets.BORINGCACHE_RESTORE_TOKEN }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: BC OCI
        uses: ./.github/actions/docker-rolling-benchmark
        with:
          strategy: boringcache
          buildkit_backend: registry
          benchmark_id: n8n-runners-distroless${{ inputs.benchmark_id_suffix }}
          project_repo: n8n-io/n8n
          dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
          docker_context: upstream
          docker_build_args: |
            --build-arg=NODE_VERSION=24.15.0
            --build-arg=N8N_VERSION=snapshot
            --build-arg=N8N_RELEASE_TYPE=dev
          image_tag: n8n-runners-distroless-benchmark:latest
          prepare_install_command: CI=true pnpm install --frozen-lockfile
          prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
          prepare_node_version: "24.13.1"
          cli_platform: linux-amd64
          cli_version: ${{ inputs.cli_version || vars.BORINGCACHE_BENCHMARK_CLI_VERSION || 'v1.13.93' }}
          benchmark_workspace: ${{ github.repository }}

  # No Docker +toolcache lanes here yet: Turbo runs in prepare_command before
  # the measured Docker build. The Docker image build itself should not be
  # relabeled as toolcache unless a static in-Docker contract is added.
  boringcache-buildkit-backend:
    name: BC BuildKit Backend / ${{ matrix.label }}
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'rolling') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: n8n
            benchmark_id: n8n-docker-bc-buildkit
            dockerfile_path: upstream/docker/images/n8n/Dockerfile
            image_tag: n8n-benchmark:latest
          - label: runners
            benchmark_id: n8n-runners-bc-buildkit
            dockerfile_path: upstream/docker/images/runners/Dockerfile
            image_tag: n8n-runners-benchmark:latest
          - label: distroless
            benchmark_id: n8n-runners-distroless-bc-buildkit
            dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
            image_tag: n8n-runners-distroless-benchmark:latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
      BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
      BORINGCACHE_API_TOKEN: ${{ secrets.BORINGCACHE_API_TOKEN || secrets.BORINGCACHE_RESTORE_TOKEN }}
      BORINGCACHE_GHCR_READ_USER: ${{ vars.BORINGCACHE_GHCR_READ_USER || github.actor }}
      BORINGCACHE_GHCR_READ_TOKEN: ${{ secrets.BORINGCACHE_GHCR_READ_TOKEN }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: BC BuildKit Backend
        uses: ./.github/actions/docker-rolling-benchmark
        with:
          strategy: boringcache
          buildkit_backend: registry
          benchmark_id: ${{ format('{0}{1}', matrix.benchmark_id, inputs.benchmark_id_suffix) }}
          project_repo: n8n-io/n8n
          dockerfile_path: ${{ matrix.dockerfile_path }}
          docker_context: upstream
          docker_build_args: |
            --build-arg=NODE_VERSION=24.15.0
            --build-arg=N8N_VERSION=snapshot
            --build-arg=N8N_RELEASE_TYPE=dev
          image_tag: ${{ matrix.image_tag }}
          prepare_install_command: CI=true pnpm install --frozen-lockfile
          prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
          prepare_node_version: "24.13.1"
          cli_platform: linux-amd64
          cli_version: ${{ inputs.cli_version || vars.BORINGCACHE_BENCHMARK_CLI_VERSION || 'v1.13.93' }}
          benchmark_workspace: ${{ github.repository }}
          buildkit_image: ${{ inputs.prewarm_buildkit_image || vars.N8N_PREWARM_BUILDKIT_IMAGE || 'ghcr.io/boringcache/buildkit:v0.30.0-bc' }}
          buildkit_cache_backend: boringcache

  fresh-github-actions-cache:
    name: GHA / ${{ matrix.label }}
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'fresh') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: n8n
            benchmark_id: n8n-docker
            dockerfile_path: upstream/docker/images/n8n/Dockerfile
            image_tag: n8n-benchmark:latest
          - label: runners
            benchmark_id: n8n-runners
            dockerfile_path: upstream/docker/images/runners/Dockerfile
            image_tag: n8n-runners-benchmark:latest
          - label: distroless
            benchmark_id: n8n-runners-distroless
            dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
            image_tag: n8n-runners-distroless-benchmark:latest
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: actions-cache
      cache_lane: fresh
      benchmark_id: ${{ format('{0}{1}', matrix.benchmark_id, inputs.benchmark_id_suffix) }}
      project_repo: n8n-io/n8n
      dockerfile_path: ${{ matrix.dockerfile_path }}
      docker_context: upstream
      docker_build_args: |
        --build-arg=NODE_VERSION=24.15.0
        --build-arg=N8N_VERSION=snapshot
        --build-arg=N8N_RELEASE_TYPE=dev
      image_tag: ${{ matrix.image_tag }}
      prepare_install_command: CI=true pnpm install --frozen-lockfile
      prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
      prepare_node_version: "24.13.1"
      benchmark_workspace: ${{ github.repository }}
    secrets: inherit

  fresh-boringcache-oci:
    name: BC OCI / ${{ matrix.label }}
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'fresh') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: n8n
            benchmark_id: n8n-docker
            dockerfile_path: upstream/docker/images/n8n/Dockerfile
            image_tag: n8n-benchmark:latest
          - label: runners
            benchmark_id: n8n-runners
            dockerfile_path: upstream/docker/images/runners/Dockerfile
            image_tag: n8n-runners-benchmark:latest
          - label: distroless
            benchmark_id: n8n-runners-distroless
            dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
            image_tag: n8n-runners-distroless-benchmark:latest
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: boringcache
      cache_lane: fresh
      buildkit_backend: registry
      benchmark_id: ${{ format('{0}{1}', matrix.benchmark_id, inputs.benchmark_id_suffix) }}
      project_repo: n8n-io/n8n
      dockerfile_path: ${{ matrix.dockerfile_path }}
      docker_context: upstream
      docker_build_args: |
        --build-arg=NODE_VERSION=24.15.0
        --build-arg=N8N_VERSION=snapshot
        --build-arg=N8N_RELEASE_TYPE=dev
      image_tag: ${{ matrix.image_tag }}
      prepare_install_command: CI=true pnpm install --frozen-lockfile
      prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
      prepare_node_version: "24.13.1"
      cli_platform: linux-amd64
      cli_version: ${{ inputs.cli_version || vars.BORINGCACHE_BENCHMARK_CLI_VERSION || 'v1.13.93' }}
      benchmark_workspace: ${{ github.repository }}
    secrets: inherit

  fresh-boringcache-buildkit-backend:
    name: BC BuildKit Backend / ${{ matrix.label }}
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'fresh') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: n8n
            benchmark_id: n8n-docker-bc-buildkit
            dockerfile_path: upstream/docker/images/n8n/Dockerfile
            image_tag: n8n-benchmark:latest
          - label: runners
            benchmark_id: n8n-runners-bc-buildkit
            dockerfile_path: upstream/docker/images/runners/Dockerfile
            image_tag: n8n-runners-benchmark:latest
          - label: distroless
            benchmark_id: n8n-runners-distroless-bc-buildkit
            dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
            image_tag: n8n-runners-distroless-benchmark:latest
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: boringcache
      cache_lane: fresh
      buildkit_backend: registry
      buildkit_cache_backend: boringcache
      benchmark_id: ${{ format('{0}{1}', matrix.benchmark_id, inputs.benchmark_id_suffix) }}
      project_repo: n8n-io/n8n
      dockerfile_path: ${{ matrix.dockerfile_path }}
      docker_context: upstream
      docker_build_args: |
        --build-arg=NODE_VERSION=24.15.0
        --build-arg=N8N_VERSION=snapshot
        --build-arg=N8N_RELEASE_TYPE=dev
      image_tag: ${{ matrix.image_tag }}
      prepare_install_command: CI=true pnpm install --frozen-lockfile
      prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
      prepare_node_version: "24.13.1"
      cli_platform: linux-amd64
      cli_version: ${{ inputs.cli_version || vars.BORINGCACHE_BENCHMARK_CLI_VERSION || 'v1.13.93' }}
      buildkit_image: ${{ inputs.prewarm_buildkit_image || vars.N8N_PREWARM_BUILDKIT_IMAGE || 'ghcr.io/boringcache/buildkit:v0.30.0-bc' }}
      benchmark_workspace: ${{ github.repository }}
    secrets: inherit
