name: "n8n Docker Benchmark"
run-name: >-
  ${{ format('Benchmark Rolling | {0}', github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.event_name == 'schedule' && 'Scheduled' || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      cli_ref:
        description: "Internal benchmark diagnostic only: build this boringcache/cli ref instead of using the released CLI"
        required: false
        type: string
      blob_download_concurrency:
        description: "Optional BORINGCACHE_BLOB_DOWNLOAD_CONCURRENCY override (blank = adaptive)"
        required: false
        type: string
      blob_prefetch_concurrency:
        description: "Optional BORINGCACHE_BLOB_PREFETCH_CONCURRENCY override (blank = match download concurrency)"
        required: false
        type: string
      oci_stream_through_min_bytes:
        description: "Optional BORINGCACHE_OCI_STREAM_THROUGH_MIN_BYTES for Docker/OCI large blobs (blank = disabled)"
        required: false
        type: string
  schedule:
    - cron: "30 3 * * 6"
  pull_request:
    paths:
      - ".gitmodules"
      - ".github/actions/docker-rolling-benchmark/**"
      - ".github/workflows/n8n-docker-benchmark.yml"
      - ".github/workflows/reusable-docker-buildkit-benchmark.yml"
      - "README.md"
      - "scenarios/**"
      - "scripts/**"
      - "upstream"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  github-actions-cache:
    name: GHA (${{ matrix.image.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        image:
          - label: n8n
            benchmark_id: n8n-docker
            dockerfile_path: upstream/docker/images/n8n/Dockerfile
            image_tag: n8n-benchmark:latest
          - label: runners
            benchmark_id: n8n-runners
            dockerfile_path: upstream/docker/images/runners/Dockerfile
            image_tag: n8n-runners-benchmark:latest
          - label: runners distroless
            benchmark_id: n8n-runners-distroless
            dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
            image_tag: n8n-runners-distroless-benchmark:latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: GHA
        uses: ./.github/actions/docker-rolling-benchmark
        with:
          strategy: actions-cache
          benchmark_id: ${{ matrix.image.benchmark_id }}
          project_repo: n8n-io/n8n
          dockerfile_path: ${{ matrix.image.dockerfile_path }}
          docker_context: upstream
          docker_build_args: |
            --build-arg=NODE_VERSION=24.15.0
            --build-arg=N8N_VERSION=snapshot
            --build-arg=N8N_RELEASE_TYPE=dev
          image_tag: ${{ matrix.image.image_tag }}
          prepare_install_command: CI=true pnpm install --frozen-lockfile
          prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
          prepare_node_version: "24.13.1"
          benchmark_workspace: ${{ github.repository }}

  boringcache-oci:
    name: BC (${{ matrix.image.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        image:
          - label: n8n
            benchmark_id: n8n-docker
            dockerfile_path: upstream/docker/images/n8n/Dockerfile
            image_tag: n8n-benchmark:latest
          - label: runners
            benchmark_id: n8n-runners
            dockerfile_path: upstream/docker/images/runners/Dockerfile
            image_tag: n8n-runners-benchmark:latest
          - label: runners distroless
            benchmark_id: n8n-runners-distroless
            dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
            image_tag: n8n-runners-distroless-benchmark:latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
      BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
      BORINGCACHE_API_TOKEN: ${{ secrets.BORINGCACHE_API_TOKEN || secrets.BORINGCACHE_RESTORE_TOKEN }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: BC
        uses: ./.github/actions/docker-rolling-benchmark
        with:
          strategy: boringcache
          buildkit_backend: registry
          benchmark_id: ${{ matrix.image.benchmark_id }}
          project_repo: n8n-io/n8n
          dockerfile_path: ${{ matrix.image.dockerfile_path }}
          docker_context: upstream
          docker_build_args: |
            --build-arg=NODE_VERSION=24.15.0
            --build-arg=N8N_VERSION=snapshot
            --build-arg=N8N_RELEASE_TYPE=dev
          image_tag: ${{ matrix.image.image_tag }}
          prepare_install_command: CI=true pnpm install --frozen-lockfile
          prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
          prepare_node_version: "24.13.1"
          cli_platform: linux-amd64
          benchmark_workspace: ${{ github.repository }}
          cli_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.cli_ref || '' }}
          cli_source_token: ${{ secrets.CLI_SOURCE_GITHUB_TOKEN || secrets.CLI_RELEASE_GITHUB_TOKEN || '' }}
          blob_download_concurrency: ${{ github.event_name == 'workflow_dispatch' && inputs.blob_download_concurrency || '' }}
          blob_prefetch_concurrency: ${{ github.event_name == 'workflow_dispatch' && inputs.blob_prefetch_concurrency || '' }}
          oci_stream_through_min_bytes: ${{ github.event_name == 'workflow_dispatch' && inputs.oci_stream_through_min_bytes || '' }}

  boringcache-auto:
    name: BC auto (${{ matrix.image.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        image:
          - label: n8n
            benchmark_id: n8n-docker
            dockerfile_path: upstream/docker/images/n8n/Dockerfile
            image_tag: n8n-benchmark:latest
          - label: runners
            benchmark_id: n8n-runners
            dockerfile_path: upstream/docker/images/runners/Dockerfile
            image_tag: n8n-runners-benchmark:latest
          - label: runners distroless
            benchmark_id: n8n-runners-distroless
            dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
            image_tag: n8n-runners-distroless-benchmark:latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
      BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
      BORINGCACHE_API_TOKEN: ${{ secrets.BORINGCACHE_API_TOKEN || secrets.BORINGCACHE_RESTORE_TOKEN }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: BC auto
        uses: ./.github/actions/docker-rolling-benchmark
        with:
          strategy: boringcache
          buildkit_backend: auto
          benchmark_id: ${{ format('{0}-auto', matrix.image.benchmark_id) }}
          project_repo: n8n-io/n8n
          dockerfile_path: ${{ matrix.image.dockerfile_path }}
          docker_context: upstream
          docker_build_args: |
            --build-arg=NODE_VERSION=24.15.0
            --build-arg=N8N_VERSION=snapshot
            --build-arg=N8N_RELEASE_TYPE=dev
          image_tag: ${{ matrix.image.image_tag }}
          prepare_install_command: CI=true pnpm install --frozen-lockfile
          prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
          prepare_node_version: "24.13.1"
          cli_platform: linux-amd64
          benchmark_workspace: ${{ github.repository }}
          cli_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.cli_ref || '' }}
          cli_source_token: ${{ secrets.CLI_SOURCE_GITHUB_TOKEN || secrets.CLI_RELEASE_GITHUB_TOKEN || '' }}
          blob_download_concurrency: ${{ github.event_name == 'workflow_dispatch' && inputs.blob_download_concurrency || '' }}
          blob_prefetch_concurrency: ${{ github.event_name == 'workflow_dispatch' && inputs.blob_prefetch_concurrency || '' }}
          oci_stream_through_min_bytes: ${{ github.event_name == 'workflow_dispatch' && inputs.oci_stream_through_min_bytes || '' }}
