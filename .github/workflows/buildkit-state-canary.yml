name: BuildKit State Canary
run-name: BuildKit state 4c | n8n Docker matrix | ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  packages: read

concurrency:
  group: buildkit-state-canary-n8n-4c
  cancel-in-progress: false

jobs:
  state:
    name: State 4c / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_id: n8n
            label: n8n
            dockerfile: docker/images/n8n/Dockerfile
            image: n8n-state-benchmark
          - case_id: n8n-runners
            label: runners
            dockerfile: docker/images/runners/Dockerfile
            image: n8n-runners-state-benchmark
          - case_id: n8n-runners-distroless
            label: runners distroless
            dockerfile: docker/images/runners/Dockerfile.distroless
            image: n8n-runners-distroless-state-benchmark
    env:
      BORINGCACHE_API_URL: https://api.boringcache.com
      BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
      BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
      BORINGCACHE_API_TOKEN: ${{ secrets.BORINGCACHE_API_TOKEN || secrets.BORINGCACHE_RESTORE_TOKEN }}
      BORINGCACHE_GHCR_READ_USER: ${{ vars.BORINGCACHE_GHCR_READ_USER || github.actor }}
      BORINGCACHE_GHCR_READ_TOKEN: ${{ secrets.BORINGCACHE_GHCR_READ_TOKEN }}
      BORINGCACHE_BUILD_MAX_ATTEMPTS: "1"
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Checkout pinned n8n source
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream

      - name: Prepare native benchmark source
        shell: bash
        run: ./scripts/prepare-source.sh base

      - name: Setup Node for Docker build artifacts
        uses: actions/setup-node@v6
        with:
          node-version: "24.13.1"

      - name: Prepare n8n Docker build artifacts
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          CI=true pnpm install --frozen-lockfile
          CI=true N8N_SKIP_LICENSES=true pnpm build:n8n

      - name: Build with persistent BuildKit state
        uses: boringcache/one@one-canary-a2a1e9c7f82d
        env:
          BORINGCACHE_BUILDKIT_MOUNTCACHE_OFFLOADER: "1"
          BORINGCACHE_REQUIRE_SERVER_SIGNATURE: "1"
        with:
          setup: none
          mode: docker
          workspace: ${{ github.repository }}
          cli-version: vcli-canary-1552d25f9179
          cli-platform: linux-amd64
          cache-runtime: "false"
          cache-backend: state
          managed-buildkit-image: ghcr.io/boringcache/buildkit@sha256:cfcc50779c981fa63ef4818e6744adfa642cc5fd00b60539def3458862739510
          cache-tag: ${{ format('{0}-buildkit-state-graduation-20260717-4c', matrix.case_id) }}
          working-directory: .
          context: upstream
          dockerfile: ${{ matrix.dockerfile }}
          image: ${{ matrix.image }}
          tags: latest
          build-args: |
            NODE_VERSION=24.15.0
            N8N_VERSION=snapshot
            N8N_RELEASE_TYPE=dev
          platforms: linux/amd64
          load: "false"
          push: "false"
          proxy-no-git: "true"
          proxy-no-platform: "true"
          no-platform: "true"
          save-policy: auto
          fail-on-cache-error: "true"
          verify: wait
          verify-require-server-signature: "true"
          diagnostics: summary
          diagnostics-artifact-name: ${{ format('{0}-state-4c-r{1}-a{2}', matrix.case_id, github.run_id, github.run_attempt) }}
          diagnostics-artifact-retention-days: "14"
          metadata-hints: ${{ format('benchmark={0},phase=commit', matrix.case_id) }}
