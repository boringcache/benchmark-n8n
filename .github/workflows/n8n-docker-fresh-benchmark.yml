name: "n8n Docker Fresh"
run-name: >-
  ${{ format('Benchmark {0} | {1}', inputs.cli_version != '' && 'Canary' || 'Fresh', github.event_name == 'schedule' && 'Weekly' || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      buildkit_image:
        description: "Optional managed BoringCache BuildKit image."
        required: false
        type: string
        default: ""
      cli_version:
        description: "Optional BoringCache CLI release tag for canary runs, for example vcli-canary."
        required: false
        type: string
        default: ""
      benchmark_id_suffix:
        description: "Optional suffix appended to built-in benchmark/cache scopes for isolated comparison runs."
        required: false
        type: string
        default: ""
  schedule:
    - cron: "30 3 * * 6"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  github-actions-cache:
    name: GHA / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: n8n
            benchmark_id: n8n-docker
            dockerfile_path: upstream/docker/images/n8n/Dockerfile
            image_tag: n8n-benchmark:latest
          - label: runners
            benchmark_id: n8n-runners
            dockerfile_path: upstream/docker/images/runners/Dockerfile
            image_tag: n8n-runners-benchmark:latest
          - label: distroless
            benchmark_id: n8n-runners-distroless
            dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
            image_tag: n8n-runners-distroless-benchmark:latest
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: actions-cache
      cache_lane: fresh
      benchmark_id: ${{ format('{0}{1}', matrix.benchmark_id, inputs.benchmark_id_suffix) }}
      project_repo: n8n-io/n8n
      dockerfile_path: ${{ matrix.dockerfile_path }}
      docker_context: upstream
      docker_build_args: |
        --build-arg=NODE_VERSION=24.15.0
        --build-arg=N8N_VERSION=snapshot
        --build-arg=N8N_RELEASE_TYPE=dev
      image_tag: ${{ matrix.image_tag }}
      prepare_install_command: CI=true pnpm install --frozen-lockfile
      prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
      prepare_node_version: "24.13.1"
      reuse_prepared_context_for_warm: true
      require_warm_cached_steps: true
      benchmark_workspace: ${{ github.repository }}
    secrets: inherit

  boringcache:
    name: BoringCache / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: n8n
            benchmark_id: n8n-docker
            dockerfile_path: upstream/docker/images/n8n/Dockerfile
            image_tag: n8n-benchmark:latest
          - label: runners
            benchmark_id: n8n-runners
            dockerfile_path: upstream/docker/images/runners/Dockerfile
            image_tag: n8n-runners-benchmark:latest
          - label: distroless
            benchmark_id: n8n-runners-distroless
            dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
            image_tag: n8n-runners-distroless-benchmark:latest
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: boringcache
      cache_lane: fresh
      benchmark_id: ${{ matrix.benchmark_id }}
      project_repo: n8n-io/n8n
      dockerfile_path: ${{ matrix.dockerfile_path }}
      docker_context: upstream
      docker_build_args: |
        --build-arg=NODE_VERSION=24.15.0
        --build-arg=N8N_VERSION=snapshot
        --build-arg=N8N_RELEASE_TYPE=dev
      image_tag: ${{ matrix.image_tag }}
      prepare_install_command: CI=true pnpm install --frozen-lockfile
      prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
      prepare_node_version: "24.13.1"
      reuse_prepared_context_for_warm: true
      require_warm_cached_steps: true
      cli_platform: linux-amd64
      buildkit_image: ${{ inputs.buildkit_image || 'ghcr.io/boringcache/buildkit:v0.30.0-bc' }}
      benchmark_workspace: ${{ github.repository }}
    secrets: inherit
