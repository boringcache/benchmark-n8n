name: "n8n Docker Fresh"
run-name: >-
  ${{ format('Benchmark {0} | {1}', inputs.cli_version != '' && 'Canary' || 'Fresh', github.event_name == 'schedule' && 'Weekly' || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      buildkit_image:
        description: "Optional managed BoringCache BuildKit image."
        required: false
        type: string
        default: ""
      cli_version:
        description: "Optional exact BoringCache CLI release tag for canary runs."
        required: false
        type: string
        default: ""
      benchmark_id_suffix:
        description: "Optional suffix for an isolated comparison run."
        required: false
        type: string
        default: ""
  schedule:
    - cron: "30 3 * * 6"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  github-actions-cache:
    name: GHA / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: n8n
            benchmark_id: n8n-docker
            dockerfile_path: upstream/docker/images/n8n/Dockerfile
            image: n8n-benchmark
          - label: runners
            benchmark_id: n8n-runners
            dockerfile_path: upstream/docker/images/runners/Dockerfile
            image: n8n-runners-benchmark
          - label: distroless
            benchmark_id: n8n-runners-distroless
            dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
            image: n8n-runners-distroless-benchmark
    uses: ./.github/workflows/reusable-n8n-docker-benchmark.yml
    with:
      strategy: actions-cache
      cache_lane: fresh
      benchmark_id: ${{ format('{0}{1}', matrix.benchmark_id, inputs.benchmark_id_suffix) }}
      dockerfile_path: ${{ matrix.dockerfile_path }}
      image: ${{ matrix.image }}
      node_version: "24.18.1"
    secrets: inherit

  boringcache:
    name: BoringCache / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: n8n
            benchmark_id: n8n-docker
            dockerfile_path: upstream/docker/images/n8n/Dockerfile
            image: n8n-benchmark
          - label: runners
            benchmark_id: n8n-runners
            dockerfile_path: upstream/docker/images/runners/Dockerfile
            image: n8n-runners-benchmark
          - label: distroless
            benchmark_id: n8n-runners-distroless
            dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
            image: n8n-runners-distroless-benchmark
    uses: ./.github/workflows/reusable-n8n-docker-benchmark.yml
    with:
      strategy: boringcache
      cache_lane: fresh
      benchmark_id: ${{ format('{0}{1}', matrix.benchmark_id, inputs.benchmark_id_suffix) }}
      cli_version: ${{ inputs.cli_version }}
      buildkit_image: ${{ inputs.buildkit_image }}
      dockerfile_path: ${{ matrix.dockerfile_path }}
      image: ${{ matrix.image }}
      node_version: "24.18.1"
    secrets: inherit
