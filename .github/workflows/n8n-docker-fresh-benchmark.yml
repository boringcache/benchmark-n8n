name: "n8n Fresh Docker Benchmark"
run-name: >-
  ${{ format('Benchmark Fresh | {0}', github.event_name == 'workflow_dispatch' && format('Manual dispatch ({0})', github.ref_name) || github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      prewarm_buildkit_image:
        description: "Optional experimental BuildKit image. When set, the fresh run adds BC BuildKit backend lanes."
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  github-actions-cache:
    name: GHA / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: n8n
            benchmark_id: n8n-docker
            dockerfile_path: upstream/docker/images/n8n/Dockerfile
            image_tag: n8n-benchmark:latest
          - label: runners
            benchmark_id: n8n-runners
            dockerfile_path: upstream/docker/images/runners/Dockerfile
            image_tag: n8n-runners-benchmark:latest
          - label: distroless
            benchmark_id: n8n-runners-distroless
            dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
            image_tag: n8n-runners-distroless-benchmark:latest
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: actions-cache
      cache_lane: fresh
      benchmark_id: ${{ matrix.benchmark_id }}
      project_repo: n8n-io/n8n
      dockerfile_path: ${{ matrix.dockerfile_path }}
      docker_context: upstream
      docker_build_args: |
        --build-arg=NODE_VERSION=24.15.0
        --build-arg=N8N_VERSION=snapshot
        --build-arg=N8N_RELEASE_TYPE=dev
      image_tag: ${{ matrix.image_tag }}
      prepare_install_command: CI=true pnpm install --frozen-lockfile
      prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
      prepare_node_version: "24.13.1"
      benchmark_workspace: ${{ github.repository }}
    secrets: inherit

  boringcache:
    name: ${{ matrix.label }} / ${{ matrix.case_label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: BC OCI
            case_label: n8n
            buildkit_backend: registry
            benchmark_id: n8n-docker
            dockerfile_path: upstream/docker/images/n8n/Dockerfile
            image_tag: n8n-benchmark:latest
          - label: BC OCI
            case_label: runners
            buildkit_backend: registry
            benchmark_id: n8n-runners
            dockerfile_path: upstream/docker/images/runners/Dockerfile
            image_tag: n8n-runners-benchmark:latest
          - label: BC OCI
            case_label: distroless
            buildkit_backend: registry
            benchmark_id: n8n-runners-distroless
            dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
            image_tag: n8n-runners-distroless-benchmark:latest
          - label: BC Native
            case_label: n8n
            buildkit_backend: native
            benchmark_id: n8n-docker-native
            dockerfile_path: upstream/docker/images/n8n/Dockerfile
            image_tag: n8n-benchmark:latest
          - label: BC Native
            case_label: runners
            buildkit_backend: native
            benchmark_id: n8n-runners-native
            dockerfile_path: upstream/docker/images/runners/Dockerfile
            image_tag: n8n-runners-benchmark:latest
          - label: BC Native
            case_label: distroless
            buildkit_backend: native
            benchmark_id: n8n-runners-distroless-native
            dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
            image_tag: n8n-runners-distroless-benchmark:latest
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: boringcache
      cache_lane: fresh
      buildkit_backend: ${{ matrix.buildkit_backend }}
      benchmark_id: ${{ matrix.benchmark_id }}
      project_repo: n8n-io/n8n
      dockerfile_path: ${{ matrix.dockerfile_path }}
      docker_context: upstream
      docker_build_args: |
        --build-arg=NODE_VERSION=24.15.0
        --build-arg=N8N_VERSION=snapshot
        --build-arg=N8N_RELEASE_TYPE=dev
      image_tag: ${{ matrix.image_tag }}
      prepare_install_command: CI=true pnpm install --frozen-lockfile
      prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
      prepare_node_version: "24.13.1"
      cli_platform: linux-amd64
      benchmark_workspace: ${{ github.repository }}
    secrets: inherit

  boringcache-buildkit-backend:
    name: BC BuildKit Backend / ${{ matrix.label }}
    if: ${{ inputs.prewarm_buildkit_image != '' || vars.N8N_PREWARM_BUILDKIT_IMAGE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: n8n
            benchmark_id: n8n-docker-bc-buildkit
            dockerfile_path: upstream/docker/images/n8n/Dockerfile
            image_tag: n8n-benchmark:latest
          - label: runners
            benchmark_id: n8n-runners-bc-buildkit
            dockerfile_path: upstream/docker/images/runners/Dockerfile
            image_tag: n8n-runners-benchmark:latest
          - label: distroless
            benchmark_id: n8n-runners-distroless-bc-buildkit
            dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
            image_tag: n8n-runners-distroless-benchmark:latest
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: boringcache
      cache_lane: fresh
      buildkit_backend: registry
      benchmark_id: ${{ matrix.benchmark_id }}
      project_repo: n8n-io/n8n
      dockerfile_path: ${{ matrix.dockerfile_path }}
      docker_context: upstream
      docker_build_args: |
        --build-arg=NODE_VERSION=24.15.0
        --build-arg=N8N_VERSION=snapshot
        --build-arg=N8N_RELEASE_TYPE=dev
      image_tag: ${{ matrix.image_tag }}
      prepare_install_command: CI=true pnpm install --frozen-lockfile
      prepare_command: CI=true N8N_SKIP_LICENSES=true pnpm build:n8n
      prepare_node_version: "24.13.1"
      cli_platform: linux-amd64
      buildkit_image: ${{ inputs.prewarm_buildkit_image || vars.N8N_PREWARM_BUILDKIT_IMAGE }}
      cache_export_type: boringcache
      benchmark_workspace: ${{ github.repository }}
    secrets: inherit
