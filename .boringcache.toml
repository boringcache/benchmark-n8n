workspace = "boringcache/benchmark-n8n"

[adapters.docker]
tag = "n8n-docker"
metadata-hints = ["benchmark=n8n-docker", "upstream-job=build-and-push-docker-image-amd64"]
command = [
  "docker", "buildx", "build",
  "--file", "__N8N_DOCKERFILE__",
  "--platform", "linux/amd64",
  "--build-arg", "NODE_VERSION=__NODE_VERSION__",
  "--build-arg", "N8N_VERSION=snapshot",
  "--build-arg", "N8N_RELEASE_TYPE=dev",
  "--provenance", "false",
  "--sbom", "false",
  "--tag", "n8n-benchmark:local",
  "upstream",
]

[adapters.turbo]
tag = "n8n-turbo-local"
metadata-hints = ["benchmark=n8n-turbo", "upstream-command=pnpm-build"]
command = ["corepack", "pnpm", "build"]
